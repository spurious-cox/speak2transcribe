# XcodeGen spec — `xcodegen` writes Speak2Transcribe.xcodeproj from this file.
name: Speak2Transcribe
options:
  bundleIdPrefix: com.timmccoy
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: RUDN8D7ZN9
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"   # Apple Distribution for the App Store
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
targets:
  Speak2Transcribe:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmccoy.speak2transcribe
        PRODUCT_NAME: Speak2Transcribe
        CODE_SIGN_ENTITLEMENTS: Speak2Transcribe.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Speak2Transcribe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Tim McCoy. MIT License."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Speak2Transcribe listens to your voice when Mic is chosen so it can transcribe what you say."
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Speak2Transcribe listens to the sound this Mac is playing so it can transcribe it."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
